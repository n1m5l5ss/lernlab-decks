# Once a day: a pull request nobody has approved for 7 days gets the label "waiting-for-review" and one
# comment that mentions everyone in MAINTAINERS.md. Nothing is ever merged automatically.
name: reminder
on:
  schedule:
    - cron: '17 8 * * *'
  workflow_dispatch:
permissions:
  contents: read
  issues: write
  pull-requests: write
jobs:
  remind:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DAYS: 7
          LABEL: waiting-for-review
        run: |
          cutoff=$(date -u -d "$DAYS days ago" +%Y-%m-%dT%H:%M:%SZ)
          people=$(grep -oE '^- @[A-Za-z0-9-]+' MAINTAINERS.md | cut -c3- | sort -u | tr '\n' ' ')
          gh label create "$LABEL" --color FBCA04 --description "Nobody has reviewed this for $DAYS days" 2>/dev/null || true
          gh pr list --state open --limit 200 --json number,createdAt,reviewDecision,labels,isDraft \
            --jq ".[] | select(.isDraft | not) | select(.createdAt < \"$cutoff\")
                  | select(.reviewDecision != \"APPROVED\")
                  | select([.labels[].name] | index(\"$LABEL\") | not) | .number" |
          while read -r n; do
            gh pr edit "$n" --add-label "$LABEL"
            gh pr comment "$n" --body "This has been waiting for a review for $DAYS days. $people, could one of you take a look? Any maintainer or reviewer can approve it (see GOVERNANCE.md).

          _Sent automatically once. Nothing is merged without a maintainer's approval._"
          done
