# Posts a plain-language summary on every deck pull request, so a maintainer can decide from the email.
# Safety: pull_request_target runs with this repository's token, so it never runs code from the pull
# request. It runs scripts/ from main and only READS the pull request's files as data.
name: summary
on:
  pull_request_target:
    types: [opened, synchronize, reopened]
permissions:
  contents: read
  pull-requests: write
jobs:
  summary:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: base
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          ref: ${{ github.event.pull_request.head.sha }}
          path: pr
          persist-credentials: false
      - run: |
          python3 base/scripts/check.py pr > check.txt 2>&1 || true
          python3 base/scripts/summary.py base pr check.txt > body.md
      - env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          gh pr comment "$PR" --repo "$GITHUB_REPOSITORY" --body-file body.md --edit-last --create-if-none \
            || gh pr comment "$PR" --repo "$GITHUB_REPOSITORY" --body-file body.md
